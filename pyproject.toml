[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porter-protocol"
version = "0.1.0"
description = "PORTER/1 mediated communications experiment"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<47"]

[tool.setuptools.packages.find]
include = ["porter*"]

[project.scripts]
porter = "porter.daemon:main"
porter-evidence = "porter.evidence:main"
